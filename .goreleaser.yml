version: 2

project_name: dym

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dymmer-code/dym/internal/version.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  disable: true
